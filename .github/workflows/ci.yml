name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format / Lint / Typecheck / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check package.json (npm pkg fix)
        run: |
          npm pkg fix
          git diff --exit-code package.json || {
            echo "::error::package.json has issues that 'npm pkg fix' would change. Run 'npm pkg fix' locally and commit the result."
            exit 1
          }

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  pack-check:
    name: Pack & publish dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports provenance
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Bump version for dry-run
        id: bump
        run: |
          ORIGINAL=$(node -p "require('./package.json').version")
          NEW="${ORIGINAL}-ci.${{ github.run_id }}.${{ github.run_attempt }}"
          npm version --no-git-tag-version "$NEW" >/dev/null
          echo "original=${ORIGINAL}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${ORIGINAL} -> ${NEW} for dry-run"

      - name: Pack tarball
        id: pack
        run: |
          TARBALL=$(bun pm pack --ignore-scripts --quiet | tail -n 1 | tr -d '[:space:]')
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "::error::Failed to determine tarball filename from 'bun pm pack' output"
            exit 1
          fi
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "Packed: ${TARBALL}"
          ls -lh "${TARBALL}"

      - name: Publish dry-run (with provenance)
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public --tag ci --dry-run

      - name: Restore version
        if: always() && steps.bump.outputs.original != ''
        run: |
          npm version --no-git-tag-version --allow-same-version "${{ steps.bump.outputs.original }}" >/dev/null
          echo "Restored version to ${{ steps.bump.outputs.original }}"
